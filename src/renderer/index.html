<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- The shell itself loads no remote code; the sites live inside <webview>. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" />
  <title>TFT Helper</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Replaces the OS titlebar (the window is frameless so overlay mode can be
       a borderless panel). The bar itself is the drag region. -->
  <div id="titlebar">
    <span id="tb-title">TFT Helper</span>
    <span id="tb-build"></span>
    <span id="tb-hint"></span>
    <div id="tb-actions">
      <!-- SVG rather than a text glyph: font glyphs render at whatever weight
           the font feels like and look ragged. Windows' own 10x10 shape. -->
      <button id="tb-close" title="Hide (app keeps running in the tray)" aria-label="Hide">
        <svg viewBox="0 0 10 10">
          <path d="M0 0l10 10M10 0L0 10" />
        </svg>
      </button>
    </div>
  </div>

  <div id="shell">
    <!-- Left rail: pinned sites -->
    <aside id="sidebar">
      <div id="tabs" role="tablist" aria-label="Pinned sites"></div>
      <button id="add-btn" title="Add a site">+</button>
    </aside>

    <!-- Content area. One <webview> per site, all loaded at startup and kept
         alive forever; switching only flips a CSS class. -->
    <main id="views">
      <!-- Ctrl+F. Searches the site you are on; Enter / Shift+Enter or F3 /
           Shift+F3 step through matches, Esc closes. -->
      <div id="findbar" hidden>
        <input id="find-input" type="text" placeholder="Find in page" spellcheck="false" aria-label="Find in page" />
        <span id="find-count"></span>
        <button id="find-prev" title="Previous match (Shift+Enter)" aria-label="Previous match">
          <svg viewBox="0 0 12 12"><path d="M2.5 7.5 6 4l3.5 3.5" /></svg>
        </button>
        <button id="find-next" title="Next match (Enter)" aria-label="Next match">
          <svg viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5" /></svg>
        </button>
        <button id="find-close" title="Close (Esc)" aria-label="Close find">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" /></svg>
        </button>
      </div>
      <div id="progress" hidden></div>
      <div id="empty">No sites yet. Hit + to add one.</div>
    </main>
  </div>

  <!-- Add / edit dialog (native <dialog>, no modal library) -->
  <dialog id="site-dialog">
    <form method="dialog" id="site-form">
      <h2 id="dialog-title">Add site</h2>
      <label>Name<input id="f-name" required maxlength="40" placeholder="MetaTFT" /></label>
      <label>URL<input id="f-url" required type="text" placeholder="https://www.metatft.com/" /></label>
      <p id="f-error" hidden></p>
      <menu>
        <button value="cancel" type="submit" formnovalidate class="ghost">Cancel</button>
        <button value="ok" type="submit" id="f-save">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Right-click menu for a sidebar item -->
  <div id="ctx" hidden></div>

  <script src="app.js"></script>
</body>
</html>
